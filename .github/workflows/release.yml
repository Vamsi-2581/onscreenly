name: Release

# Builds Onscreenly for macOS, Windows and Linux after the checks and the app
# tests pass on each OS. A version tag (v1.2.3) publishes a GitHub release
# with SHA256SUMS; a pull request that changes packaging, or a manual run,
# builds the same files as downloadable workflow artifacts without
# publishing anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'electron-builder.cjs'
      - 'build-resources/**'
      - 'scripts/after-pack.js'
      - 'scripts/prepare-whisper-runtime.js'
      - 'scripts/mac-self-sign.js'
      - 'scripts/ci-mac-keychain.sh'
      - 'scripts/make-mac-signing-cert.sh'
      # Electron and dependency bumps: run the macOS and Windows app tests and packaging before merge.
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="v$(node -p 'require("./package.json").version')"
          test "$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package.json ($version)"; exit 1; }

      - name: Lint, format, type check and unit tests
        run: npm run check

      - name: App tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: App tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Check for a Publik app token
        id: publik
        shell: bash
        env:
          PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
        run: echo "configured=$([ -n "$PUBLIK_APP_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Embed the Publik app token
        # Optional. The token is a publishable identifier that ships in the
        # binary and lets the Publik gateway attribute and rate-limit installs;
        # without it the Publik provider option is simply absent.
        if: steps.publik.outputs.configured == 'true'
        shell: bash
        env:
          PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs"); const p = "src/integrations/publik-build.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            cfg.appToken = process.env.PUBLIK_APP_TOKEN;
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + "\n");
          '
          node -e 'const c = require("./src/integrations/publik-build.json"); if (!c.appToken) process.exit(1); console.log("Publik app token embedded")'

      - name: Build macOS (Intel and Apple Silicon)
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Ad-hoc signed unless a Developer ID certificate is configured (see
          # electron-builder.cjs). electron-builder skips all signing on pull
          # requests unless CSC_FOR_PULL_REQUEST is set, which would leave a
          # broken signature; an ad-hoc signature uses no secret, so it is
          # safe there. Pull requests never receive the certificate.
          CSC_FOR_PULL_REQUEST: 'true'
          CERT_LINK: ${{ github.event_name != 'pull_request' && secrets.CSC_LINK || '' }}
          CERT_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.CSC_KEY_PASSWORD || '' }}
          NOTARY_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
          NOTARY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          NOTARY_TEAM: ${{ github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
          # The self-signed certificate (scripts/make-mac-signing-cert.sh): one identity for every build,
          # so macOS keeps users' permissions across updates. Pull requests sign with a throwaway one
          # instead, which tests the same path without the secret.
          SELF_SIGN_P12: ${{ github.event_name != 'pull_request' && secrets.MAC_SELF_SIGN_P12 || '' }}
          SELF_SIGN_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MAC_SELF_SIGN_PASSWORD || '' }}
        run: |
          set -euo pipefail
          sign_with_p12() {
            export ONSCREENLY_MAC_SIGN_KEYCHAIN="$RUNNER_TEMP/onscreenly-signing.keychain-db"
            ONSCREENLY_MAC_SIGN_IDENTITY="$(scripts/ci-mac-keychain.sh "$1" "$2" "$ONSCREENLY_MAC_SIGN_KEYCHAIN")"
            export ONSCREENLY_MAC_SIGN_IDENTITY
          }
          # Only set the signing variables when there is a certificate:
          # electron-builder treats an empty CSC_LINK as a path and fails.
          if [ -n "$CERT_LINK" ]; then
            export MAC_SIGN=1 CSC_LINK="$CERT_LINK" CSC_KEY_PASSWORD="$CERT_PASSWORD"
            export APPLE_ID="$NOTARY_ID" APPLE_APP_SPECIFIC_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$NOTARY_TEAM"
            echo "SIGN_MODE=developer-id" >> "$GITHUB_ENV"
          elif [ -n "$SELF_SIGN_P12" ]; then
            printf '%s' "$SELF_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            sign_with_p12 "$RUNNER_TEMP/signing.p12" "$SELF_SIGN_PASSWORD"
            echo "SIGN_MODE=self-signed" >> "$GITHUB_ENV"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            scripts/make-mac-signing-cert.sh --ci "$RUNNER_TEMP/throwaway-cert"
            sign_with_p12 "$RUNNER_TEMP/throwaway-cert/onscreenly-signing.p12" "$(cat "$RUNNER_TEMP/throwaway-cert/password.txt")"
            echo "SIGN_MODE=self-signed" >> "$GITHUB_ENV"
          else
            echo "SIGN_MODE=ad-hoc" >> "$GITHUB_ENV"
          fi
          npm run dist:mac

      - name: Verify the macOS signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "Signed: $SIGN_MODE"
          requirements=()
          for app in dist/mac*/Onscreenly.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Identifier|Signature|Authority|TeamIdentifier)='
            requirement="$(codesign --display --requirements - "$app" 2>&1 | grep '^designated')"
            echo "$requirement"
            requirements+=("$requirement")
            if [ "$SIGN_MODE" = self-signed ]; then
              # What macOS keys permissions on: the app id and the certificate, nothing about this build.
              echo "$requirement" | grep -Eq 'identifier "com\.onscreenly\.overlay" and certificate (root|leaf) = H"' \
                || { echo "::error::$app is not signed with the self-signed certificate"; exit 1; }
              # Every helper and framework carries the same signer, or macOS refuses to load them.
              find "$app/Contents/Frameworks" -maxdepth 1 \( -name '*.app' -o -name '*.framework' \) -print0 |
                while IFS= read -r -d '' part; do
                  codesign --display --verbose=2 "$part" 2>&1 | grep -q '^Authority=Onscreenly Self-Signed$' \
                    || { echo "::error::$part is not signed with the self-signed certificate"; exit 1; }
                done
            fi
          done
          # Both architectures, built apart, must ask for the same identity: that is what lets the
          # next release inherit this one's permissions.
          if [ "$SIGN_MODE" = self-signed ] && [ "${#requirements[@]}" -gt 1 ]; then
            [ "$(printf '%s\n' "${requirements[@]}" | sort -u | wc -l)" -eq 1 ] \
              || { echo "::error::the builds ask for different identities"; exit 1; }
          fi

      - name: Build Windows (installer and portable)
        if: runner.os == 'Windows'
        run: npm run dist:win

      - name: Build Linux (AppImage and .deb for x64, AppImage for arm64)
        if: runner.os == 'Linux'
        run: npm run dist:linux && npm run dist:linux:arm64

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: onscreenly-${{ matrix.name }}
          path: |
            dist/Onscreenly-*.zip
            dist/Onscreenly-*.exe
            dist/Onscreenly-*.AppImage
            dist/Onscreenly-*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          pattern: onscreenly-*
          path: release
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: release
        run: |
          sha256sum Onscreenly-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        # Artifact attestations need a public repository (or GitHub Enterprise
        # Cloud for a private one). Once the repository is public, every
        # download can be checked with `gh attestation verify`.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/Onscreenly-*'

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            **Install:** see the [install guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/install.md). These builds are not signed with an Apple or Microsoft certificate, so macOS and Windows ask once before the first launch; the guide shows how.

            **Verify:** download `SHA256SUMS` next to your file and run `shasum -a 256 -c SHA256SUMS --ignore-missing` (macOS/Linux) or compare `Get-FileHash <file>` (Windows).
